# ============================================================
# GlyciBio — Configuration Nginx de production
# ============================================================

# Note : Si vous configurez SSL/HTTPS en production, vous pouvez ajouter
# une redirection HTTP vers HTTPS (cf. docs/DEPLOYMENT.md) et monter vos
# certificats SSL Let's Encrypt sur le port 443.

server {
    listen 80;
    server_name localhost;

    # Upload d'images (produits, fond du hero) : depasse la limite nginx par
    # defaut (1 Mo) -> sinon 413 avant meme d'atteindre l'API. Aligne au-dessus
    # du plafond multer (5 Mo) pour que la validation applicative prime.
    client_max_body_size 10m;

    # En-tetes de securite (complementaires a Helmet cote API).
    # CSP : defini une fois ($csp) puis reutilise dans location = /index.html
    # (un location qui possede son propre add_header N'HERITE PAS de ceux du
    # bloc server — regle nginx). Le hash autorise le seul script inline
    # (bootstrap du theme dans index.html) sans 'unsafe-inline' pour les scripts.
    # NB: regenerer le hash si ce script inline change (cf. DEPLOYMENT.md).
    # img-src inclut blob: pour l'apercu d'image (URL.createObjectURL) cote admin.
    set $csp "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: blob:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'sha256-i2oDm7OdxzP3Mbl9tVHGCZJg4q6YTDaH6He3+GZ42G0='; connect-src 'self'";
    set $permissions_policy "camera=(), microphone=(), geolocation=(), usb=(), browsing-topics=()";

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy $csp always;
    add_header Permissions-Policy $permissions_policy always;

    # Compression gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/xml application/json;
    gzip_disable "MSIE [1-6]\.";

    # Dossier racine du frontend statique compile
    root /usr/share/nginx/html;
    index index.html;

    # index.html : jamais mis en cache dur -> un nouveau deploiement est vu de suite.
    location = /index.html {
        # Re-declaration des en-tetes de securite : un location avec add_header
        # n'herite pas de ceux du bloc server (regle nginx).
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy $csp always;
        add_header Permissions-Policy $permissions_policy always;
        add_header Cache-Control "no-cache" always;
    }

    # Assets hashes par Vite + polices : nom de fichier change a chaque build,
    # donc cache 1 an "immutable" sans risque de servir une version perimee.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
    }
    location /fonts/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
    }

    # Gestion du routage SPA (fallback vers index.html)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Sitemap dynamique genere par l'API Express. Sans ce proxy explicite, le
    # fallback SPA ci-dessus renverrait index.html (HTML) au lieu du XML : le
    # sitemap annonce par robots.txt serait casse pour les moteurs de recherche.
    location = /sitemap.xml {
        proxy_pass http://api:5000/sitemap.xml;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy vers l'API Node.js
    location /api/ {
        proxy_pass http://api:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Images uploadees servies par le backend (cache navigateur long)
    location /uploads/ {
        proxy_pass http://api:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 30d;
        add_header Cache-Control "public" always;
    }
}
