# ============================================================
# GlyciBio — Configuration Nginx de production
# ============================================================

# Note : Si vous configurez SSL/HTTPS en production, vous pouvez ajouter
# une redirection HTTP vers HTTPS (cf. docs/DEPLOYMENT.md) et monter vos
# certificats SSL Let's Encrypt sur le port 443.

server {
    listen 80;
    server_name localhost;

    # En-tetes de securite (complementaires a Helmet cote API)
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Compression gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/xml application/json;
    gzip_disable "MSIE [1-6]\.";

    # Dossier racine du frontend statique compile
    root /usr/share/nginx/html;
    index index.html;

    # Gestion du routage SPA (fallback vers index.html)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy vers l'API Node.js
    location /api/ {
        proxy_pass http://api:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Images uploadees servies par le backend
    location /uploads/ {
        proxy_pass http://api:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
