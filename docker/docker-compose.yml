# ============================================================
# GlyciBio — Docker Compose
# MySQL 8 + Node.js API
# ============================================================
services:
  # Base de donnees MySQL
  db:
    image: mysql:8.0
    container_name: glycibio-db
    restart: unless-stopped
    environment:
      # Pas de valeur par defaut : Compose ECHOUE si la variable est absente
      # (evite de demarrer MySQL avec un mot de passe d'usine connu et public).
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD requis dans docker/.env}
      MYSQL_DATABASE: ${DB_NAME:-glycibio}
      # Utilisateur applicatif dedie a privileges restreints (principe du
      # moindre privilege) : l'API ne se connecte JAMAIS en root.
      #   - Installation NEUVE : l'image mysql cree cet utilisateur au premier
      #     demarrage (volume vide) ET le script init.sql le (re)cree de maniere
      #     idempotente (CREATE USER IF NOT EXISTS + GRANT sur ${DB_NAME}).
      #   - MISE A NIVEAU (volume db_data deja existant) : l'image ne rejoue PAS
      #     l'init, donc l'utilisateur n'est pas cree automatiquement. Creez-le
      #     une fois (voir le bloc "0) Utilisateur applicatif" dans
      #     database/glycibio-database-v1.5-final.sql) OU reinitialisez via
      #     `docker compose down -v && docker compose up -d` (efface les donnees).
      MYSQL_USER: ${DB_USER:-glycibio_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD requis dans docker/.env}
    ports:
      - "${DB_HOST_PORT:-3307}:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ../database/glycibio-database-production.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # API Node.js
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.node
    container_name: glycibio-api
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${DB_USER:-glycibio_app}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD requis dans docker/.env}
      DB_NAME: ${DB_NAME:-glycibio}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET_KEY: ${JWT_REFRESH_SECRET_KEY}
      JWT_ALGO: HS256
      JWT_EXPIRES_IN: 24h
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:5173}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      # Suivi des erreurs (no-op si SENTRY_DSN vide)
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_TRACES_RATE: ${SENTRY_TRACES_RATE:-0.1}
      APP_VERSION: ${APP_VERSION:-1.5.0}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ../server/uploads:/app/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Frontend React (Nginx)
  client:
    build:
      context: ..
      dockerfile: docker/Dockerfile.client
    container_name: glycibio-client
    restart: unless-stopped
    ports:
      - "${CLIENT_PORT:-80}:80"
    depends_on:
      - api

volumes:
  db_data:
