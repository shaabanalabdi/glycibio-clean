<body>
  <div id="root"></div>
  <script>
    // Theme bootstrap : applique le theme AVANT le rendu React (anti-flash).
    // Priorite : choix utilisateur en localStorage > preference systeme.
    (function () {
      try {
        var stored = localStorage.getItem('glycibio-theme');
        if (stored === 'dark' || stored === 'light') {
          document.documentElement.setAttribute('data-theme', stored);
        }
        // Sinon : pas d'attribut -> on laisse @media (prefers-color-scheme) decider.
      } catch (e) { /* localStorage indisponible (mode prive Safari) */ }
    })();
  </script>
  <script type="module" src="/src/main.jsx"></script>
</body>
