name: CI

# ============================================================
# Integration continue GlyciBio (DWWM) — Node 20
#   1) quality        : lint (ESLint) + build (Vite) + npm audit (non bloquant)
#   2) client-tests   : tests unitaires front (node --test)
#   3) server-tests   : tests unitaires back  (node --test, sans base)
#   4) integration    : tests d'integration back contre une VRAIE base MySQL 8
#   5) web-audit      : Lighthouse + Pa11y sur le build (NON bloquant)
# ============================================================

on:
  push:
    branches: [main, hardening]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------
  # 1) Qualite : lint + build + audit de securite des dependances
  # ----------------------------------------------------------
  quality:
    name: Lint - Build - Audit (Node 20)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install client deps
        working-directory: client
        run: npm ci

      - name: Lint client (ESLint)
        working-directory: client
        run: npm run lint

      - name: Build client (Vite)
        working-directory: client
        run: npm run build

      - name: Install server deps
        working-directory: server
        run: npm ci

      - name: npm audit (non bloquant)
        continue-on-error: true
        run: |
          echo "::group::client audit"
          npm audit --omit=dev --audit-level=high --prefix client || true
          echo "::endgroup::"
          echo "::group::server audit"
          npm audit --omit=dev --audit-level=high --prefix server || true
          echo "::endgroup::"

  # ----------------------------------------------------------
  # 2) Tests unitaires front (node --test)
  # ----------------------------------------------------------
  client-tests:
    name: Tests front (Node 20)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install client deps
        working-directory: client
        run: npm ci
      - name: Run client unit tests
        working-directory: client
        run: npm test

  # ----------------------------------------------------------
  # 3) Tests unitaires back (sans base ; l'integration est ignoree)
  # ----------------------------------------------------------
  server-tests:
    name: Tests back unitaires (Node 20)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install server deps
        working-directory: server
        run: npm ci
      - name: Run server unit tests
        working-directory: server
        run: npm test

  # ----------------------------------------------------------
  # 4) Tests d'integration back contre une vraie base MySQL 8
  #    (active par les variables TEST_DB_* ; cf. order.integration.test.js)
  # ----------------------------------------------------------
  integration:
    name: Tests integration MySQL 8 (Node 20)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: glycibio_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Wait for MySQL
        run: |
          for i in $(seq 1 30); do
            if mysqladmin ping -h 127.0.0.1 -P 3306 -uroot -proot --silent; then
              echo "MySQL is up"; break
            fi
            echo "waiting for mysql ($i)..."; sleep 2
          done

      - name: Load production schema
        run: mysql -h 127.0.0.1 -P 3306 -uroot -proot glycibio_test < database/glycibio-database-production.sql

      - name: Install server deps
        working-directory: server
        run: npm ci

      - name: Run integration tests
        working-directory: server
        env:
          TEST_DB_HOST: 127.0.0.1
          TEST_DB_PORT: "3306"
          TEST_DB_USER: root
          TEST_DB_PASSWORD: root
          TEST_DB_NAME: glycibio_test
        run: npm test

  # ----------------------------------------------------------
  # 5) Audit web Lighthouse + Pa11y sur le build — NON bloquant
  # ----------------------------------------------------------
  web-audit:
    name: Audit web (Lighthouse + Pa11y) - non bloquant
    runs-on: ubuntu-latest
    needs: quality
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install client deps
        working-directory: client
        run: npm ci

      - name: Build client
        working-directory: client
        run: npm run build

      - name: Serve build + run audits
        working-directory: client
        continue-on-error: true
        run: |
          npx --yes vite preview --port 4173 --host 127.0.0.1 &
          npx --yes wait-on http://127.0.0.1:4173 --timeout 60000
          echo "::group::Lighthouse"
          npx --yes @lhci/cli@0.13.x collect --url=http://127.0.0.1:4173 --numberOfRuns=1 || true
          echo "::endgroup::"
          echo "::group::Pa11y"
          npx --yes pa11y http://127.0.0.1:4173 || true
          echo "::endgroup::"
