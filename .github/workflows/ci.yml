name: CI

# Pipeline d'integration continue GlyciBio.
# Se declenche sur push/PR vers main. Deux jobs paralleles : API et Front.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Annule les runs precedents encore en cours sur la meme ref (economise du CI).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------------
  # API Node/Express : install -> tests (node:test) -> audit securite
  # ----------------------------------------------------------------
  server:
    name: API (server)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install (npm ci)
        run: npm ci

      - name: Tests (node:test)
        run: npm test
        env:
          NODE_ENV: test
          DISABLE_CRON: "1"
          JWT_SECRET: ci_test_secret_de_32_caracteres_minimum_xx

      - name: Audit securite (dependances de prod, niveau high+)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

  # ----------------------------------------------------------------
  # Front React/Vite : install -> lint -> build -> audit securite
  # ----------------------------------------------------------------
  client:
    name: Front (client)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      # --legacy-peer-deps : aligne sur docker/Dockerfile.client (conflits de
      # peer-deps autour de React 19 / react-router 7).
      - name: Install (npm ci)
        run: npm ci --legacy-peer-deps

      - name: Lint (eslint)
        run: npm run lint

      - name: Build (vite)
        run: npm run build
        env:
          VITE_API_URL: /api

      - name: Audit securite (dependances de prod, niveau high+)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

  # ----------------------------------------------------------------
  # Tests d'INTEGRATION : MySQL reel (service conteneurise) -> verifie le code
  # transactionnel (creation de commande, decrement de stock, idempotence du
  # marquage paye, restauration de stock). Job separe car il a besoin d'une BDD.
  # ----------------------------------------------------------------
  integration:
    name: API (integration MySQL)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: glycibio_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install (npm ci)
        run: npm ci

      - name: Charger le schema dans MySQL
        run: mysql -h 127.0.0.1 -P 3306 -u root -proot glycibio_test < ../database/glycibio-database-production.sql

      - name: Tests (unitaires + integration)
        run: npm test
        env:
          NODE_ENV: test
          DISABLE_CRON: "1"
          JWT_SECRET: ci_test_secret_de_32_caracteres_minimum_xx
          TEST_DB_HOST: 127.0.0.1
          TEST_DB_PORT: "3306"
          TEST_DB_USER: root
          TEST_DB_PASSWORD: root
          TEST_DB_NAME: glycibio_test

  # ----------------------------------------------------------------
  # Audit web NON BLOQUANT : performance + accessibilite (Lighthouse CI
  # + Pa11y) sur le build du front. Remplace l'execution locale (ces outils
  # sont absents de l'environnement de dev). Toutes les etapes tolerent les
  # erreurs (continue-on-error) -> informatif, ne bloque jamais la CI.
  # ----------------------------------------------------------------
  audit-web:
    name: Audit web (Lighthouse + Pa11y, non bloquant)
    runs-on: ubuntu-latest
    needs: client
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install (npm ci)
        run: npm ci --legacy-peer-deps
        continue-on-error: true

      - name: Build (vite)
        run: npm run build
        env:
          VITE_API_URL: /api
        continue-on-error: true

      - name: Lighthouse CI (perf / a11y / SEO / best-practices)
        run: npx --yes @lhci/cli@0.14.x autorun --collect.staticDistDir=./dist --collect.numberOfRuns=1 --upload.target=filesystem --upload.outputDir=./.lighthouseci
        continue-on-error: true

      - name: Pa11y (accessibilite WCAG2AA)
        run: |
          npx --yes serve -s dist -l 4173 &
          npx --yes wait-on http://127.0.0.1:4173 -t 30000
          npx --yes pa11y --standard WCAG2AA http://127.0.0.1:4173/
        continue-on-error: true

      - name: Publier le rapport Lighthouse (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: client/.lighthouseci
          if-no-files-found: ignore
