# ============================================================
# GlyciBio — Bloc serveur Nginx de PRODUCTION (OVH VPS, glycibio.fr)
# Optimise pour la performance (Lighthouse) : compression, cache des
# assets hashes (immutable), HTTP/2, en-tetes de securite.
#
# A appliquer sur le VPS :
#   sudo cp deploy/nginx/glycibio.conf /etc/nginx/sites-available/glycibio
#   sudo ln -sf /etc/nginx/sites-available/glycibio /etc/nginx/sites-enabled/glycibio
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Pre-requis : le certificat Let's Encrypt existe deja (certbot l'a cree).
#   -> /etc/letsencrypt/live/glycibio.fr/{fullchain,privkey}.pem
#   Si ce n'est pas encore le cas, deployer d'abord un bloc :80 simple,
#   lancer `sudo certbot --nginx -d glycibio.fr -d www.glycibio.fr`,
#   PUIS remplacer par ce fichier.
#
# ADAPTER `root` si le chemin reel de l'app differe.
# ============================================================

# ---- HTTP -> redirection vers HTTPS -------------------------
server {
    listen 80;
    listen [::]:80;
    server_name glycibio.fr www.glycibio.fr;
    return 301 https://$host$request_uri;
}

# ---- HTTPS (HTTP/2) -----------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl;
    # HTTP/2 active via "listen ... http2" ci-dessus (compatible nginx 1.24, OVH/Ubuntu 24.04).
    # NB: la directive autonome "http2 on;" requiert nginx >= 1.25.1.
    server_name glycibio.fr www.glycibio.fr;

    # --- TLS (gere par certbot) ---
    ssl_certificate     /etc/letsencrypt/live/glycibio.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/glycibio.fr/privkey.pem;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_stapling        on;
    ssl_stapling_verify on;

    # --- Racine du front statique compile (client/dist) ---
    root /home/glycibio/glycibio/client/dist;
    index index.html;

    # Upload d'images (produits, fond du hero) : depasse la limite nginx par
    # defaut (1 Mo) -> sinon 413 avant meme d'atteindre l'API. Aligne au-dessus
    # du plafond multer (5 Mo) pour que la validation applicative prime.
    client_max_body_size 10m;

    # --- En-tetes de securite (sur le document HTML) ---
    # CSP : defini une fois ($csp) puis reutilise dans location = /index.html
    # (un location qui possede son propre add_header N'HERITE PAS de ceux du
    # bloc server — regle nginx). Le hash autorise le seul script inline
    # (bootstrap du theme dans index.html) sans 'unsafe-inline' pour les scripts.
    # NB: regenerer le hash si ce script inline change (cf. DEPLOYMENT.md).
    # img-src inclut blob: pour l'apercu d'image (URL.createObjectURL) cote admin.
    set $csp "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; img-src 'self' data: blob:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'sha256-Ch4V8cJ7fq9IUCUfgr1xVb4cpqrXCb9TQWrTVpRzDoY='; connect-src 'self'; upgrade-insecure-requests";
    set $permissions_policy "camera=(), microphone=(), geolocation=(), usb=(), browsing-topics=()";

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy $csp always;
    add_header Permissions-Policy $permissions_policy always;

    # ============================================================
    # COMPRESSION
    # ============================================================
    # gzip : disponible partout. Reduit le JS/CSS d'environ -70%.
    # (Le woff2 est deja compresse -> NE PAS le gziper.)
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        text/xml
        application/javascript
        application/json
        application/xml
        application/manifest+json
        application/rss+xml
        application/wasm
        image/svg+xml;

    # --- Brotli (OPTIONNEL, meilleur que gzip de ~15-20%) ---
    # Necessite le module : sudo apt install libnginx-mod-http-brotli  (ou build ngx_brotli)
    # puis decommenter :
    # brotli on;
    # brotli_comp_level 5;
    # brotli_types text/css text/javascript application/javascript application/json image/svg+xml application/manifest+json;

    # ============================================================
    # CACHE STATIQUE  (corrige l'audit Lighthouse "efficient cache policy")
    # ============================================================
    # index.html : JAMAIS mis en cache dur -> un nouveau deploy est vu tout de suite.
    location = /index.html {
        # Re-declaration des en-tetes de securite : un location avec add_header
        # n'herite pas de ceux du bloc server (regle nginx).
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy $csp always;
        add_header Permissions-Policy $permissions_policy always;
        add_header Cache-Control "no-cache" always;
    }

    # Assets hashes par Vite (/assets/app-XXXX.js) : le nom change a chaque
    # build -> cache 1 an "immutable" sans risque de servir une version perimee.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # Polices auto-hebergees : stables -> cache long.
    location /fonts/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # Favicons / icones / manifest : cache moyen.
    location ~* \.(?:ico|png|webp|avif|svg|webmanifest|txt)$ {
        expires 30d;
        add_header Cache-Control "public" always;
        access_log off;
    }

    # ============================================================
    # API Node/Express (PM2) — meme origine
    # ============================================================
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        'upgrade';
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Images uploadees (servies par l'API) : cache navigateur long.
    location /uploads/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 30d;
        add_header Cache-Control "public" always;
    }

    # Sitemap dynamique (genere par l'API Express). Indispensable : sinon le
    # fallback SPA ci-dessous renvoie index.html (HTML) au lieu du XML, et le
    # sitemap annonce par robots.txt est casse pour les moteurs de recherche.
    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:5000/sitemap.xml;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ============================================================
    # Fallback SPA (React Router) — toute autre route -> index.html
    # ============================================================
    location / {
        try_files $uri $uri/ /index.html;
    }
}
